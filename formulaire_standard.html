<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Formulaire de contact</title>
        <link rel="stylesheet" href="formulaire.css">
    </head>
    <header class="header">
        <button class="signin">Se connecter</button>
        <button class="login">S'inscrire</button>
    </header>
    <body class="body">
        <h1>Formulaire</h1>
        <script src="formulaire_standard.js"></script>
        <p>Veuillez entrer vos informations ci-dessous afin de nous contacter</p>
        <form>
            <div class="form-group">
            <div class="informations">   
            <label>Nom :</label>
            <input type = "text"
placeholder="Entrer votre nom"><br><br>

            <label>Prenoms :</label>
            <input type = "text"
placeholder="Entrer vos prenoms"><br><br>

            <label>Email :</label>
            <input type = "text"
placeholder="example@gmail.com"><br><br>
            </div>
            <div class="message">
            <label>Message :</label>
            <textarea rows="20" cols="100"></textarea><br><br>
            </div>
            </div>
            <button class="send">Envoyer</button>
            <button class="help">Aide</button>
        </form>
    </body>
</html>
